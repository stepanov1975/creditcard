[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ccparser"
version = "0.1.0"
description = "Local credit-card statement parser"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

