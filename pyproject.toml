[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ccparser"
version = "0.2.0"
description = "Local credit-card statement parser"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3", "pymupdf>=1.28,<2", "typer>=0.27,<1"]

[project.scripts]
ccparse = "ccparser.cli:app"

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ccparser"]
mypy_path = "src"
